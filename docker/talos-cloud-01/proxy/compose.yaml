services:
  caddy:
    image: caddy:2.9.1
    container_name: caddy-proxy
    restart: unless-stopped
    networks: [proxy]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  caddy-data:
  caddy-config:
networks:
  proxy:
    external: true