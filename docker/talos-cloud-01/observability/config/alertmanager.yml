global:
  resolve_timeout: 5m
inhibit_rules:
- equal:
  - namespace
  - alertname
  source_matchers:
  - severity = critical
  target_matchers:
  - severity =~ warning|info
- equal:
  - namespace
  - alertname
  source_matchers:
  - severity = warning
  target_matchers:
  - severity = info
- equal:
  - namespace
  source_matchers:
  - alertname = InfoInhibitor
  target_matchers:
  - severity = info
- target_matchers:
  - alertname = InfoInhibitor
receivers:
- name: "null"
- name: telegram
  telegram_configs:
  - bot_token_file: /etc/alertmanager/telegram_token
    chat_id: -1003129190360
    message: '{{ template "telegram.message". }}'
    parse_mode: HTML
route:
  group_by:
  - namespace
  group_interval: 5m
  group_wait: 30s
  receiver: telegram
  repeat_interval: 12h
  routes:
  - matchers:
    - alertname = "Watchdog"
    receiver: "null"
  - matchers:
    - severity =~ "warning|critical"
    receiver: telegram
templates:
- /etc/alertmanager/telegram.tmpl