# Homelab K8s cluster — 1 CP + 2 worker topology.
# talos-00 = control-plane only; talos-01/02 = worker.
# talos-alpha was removed (migrated CP to talos-00, 2026-07-22).
# etcd for K8s runs on talos-00 only (host systemd service, single-member etcd0).
# Patroni/PostgreSQL/pgbouncer were decommissioned 2026-10-22 (data migrated to a
# new Postgres instance): Patroni + PostgreSQL packages/configs/data removed from
# all nodes, and the orphaned etcd members on talos-01/02 (left over from the old
# 3-CP topology) were removed. HAProxy no longer exposes the Postgres LBs (6432/6433).
# SSH: user=ubuntu, key=~/ssh-keys/homelab-linux (set in group_vars/all/all.yml)
#
# K8s version: v1.35.5 | OS: Ubuntu 26.04.1 LTS (kernel 7.0.0-38) | Runtime: containerd v2.3.1
# etcd: v3.5.27 | CNI: Calico v3.30.6 VXLAN
#
# Ubuntu 26.04 upgrade notes (2026-10-22):
# - linux-sysctl-defaults removed the procps-owned /etc/sysctl.conf, which used to
#   supply the kubelet-required tunables. They now live in
#   /etc/sysctl.d/99-kubernetes.conf (vm.overcommit_memory=1, kernel.panic=10,
#   kernel.panic_on_oops=1). Without it kubelet crash-loops with
#   "Failed to start ContainerManager: invalid kernel flag ...".
# - The 26.04 kernel renames talos-00's NIC enp6s18 -> ens18. keepalived must match,
#   because kube-scheduler/kube-controller-manager kubeconfigs use the API VIP
#   192.168.1.14 (keepalived on talos-00) rather than 192.168.1.11.

[kube_control_plane]
talos-00 ansible_host=192.168.1.11 ip=192.168.1.11 etcd_member_name=etcd0

[kube_node]
talos-01 ansible_host=192.168.1.12  ip=192.168.1.12  etcd_member_name=etcd2
talos-02 ansible_host=192.168.1.13  ip=192.168.1.13  etcd_member_name=etcd3

[etcd:children]
kube_control_plane

[k8s_cluster:children]
kube_control_plane
kube_node

[calico_rr]

[vault]
